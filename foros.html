<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foros Complementarios</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #ffffff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
  }

  .foros-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    width: 100%;
    max-width: 1100px;
  }

  a.banner {
    display: block;
    text-decoration: none;
    border-radius: 10px;
    overflow: hidden;
    height: 110px;
    box-shadow: 0 4px 18px rgba(0,0,0,.18);
    transition: transform .2s, box-shadow .2s;
  }

  a.banner:hover {
    transform: translateY(-4px) scale(1.03);
    box-shadow: 0 12px 36px rgba(0,0,0,.28);
  }

  a.banner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  @media (max-width: 700px) {
    .foros-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 400px) {
    .foros-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="foros-grid">

  <!-- FORO 1: cambia href y src -->
  <a class="banner" href="TU_LINK_AQUI" target="_blank">
    <img src="TU_IMAGEN_1.jpg" alt="Foro 01">
  </a>

  <!-- FORO 2: cambia href y src -->
  <a class="banner" href="TU_LINK_AQUI" target="_blank">
    <img src="TU_IMAGEN_2.jpg" alt="Foro 02">
  </a>

  <!-- FORO 3: cambia href y src -->
  <a class="banner" href="TU_LINK_AQUI" target="_blank">
    <img src="TU_IMAGEN_3.jpg" alt="Foro 03">
  </a>

  <!-- FORO 4: cambia href y src -->
  <a class="banner" href="TU_LINK_AQUI" target="_blank">
    <img src="TU_IMAGEN_4.jpg" alt="Foro 04">
  </a>

</div>

</body>
</html>
