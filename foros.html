<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Foros Complementarios</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:40px 20px;
    font-family:Arial, sans-serif;
  }
  .carousel-container{
    width:100%;
    max-width:1200px;
    overflow:hidden;
    position:relative;
  }
  .carousel-track{
    display:flex;
    transition:transform 0.8s ease-in-out;
    gap:0;
  }
  .banner{
    min-width:100%;
    overflow:hidden;
    text-decoration:none;
    transition:transform .3s ease;
  }
  .banner:hover{transform:scale(1.02);}
  .banner img{width:100%;display:block;}
</style>
</head>
<body>
<div class="carousel-container">
  <div class="carousel-track" id="carouselTrack">
    <a class="banner" href="https://empleabilidad.blackwell.university/registro/" target="_blank">
      <img src="https://i.postimg.cc/tCfWK91c/GAN-POST-30-mayo.jpg" alt="Banner 05"/>
    </a>
    <a class="banner" href="https://www.iberoteca.net/" target="_blank">
      <img src="https://i.postimg.cc/sx3CDFvL/pagos.jpg" alt="Banner 06"/>
    </a>
    
  </div>
</div>
<script>
  const track = document.getElementById("carouselTrack");
  const banners = document.querySelectorAll(".banner");
  let index = 0;

  function moveCarousel() {
    index++;
    if(index >= banners.length){
      index = 0;
    }
    const bannerWidth = banners[0].offsetWidth;
    track.style.transform = `translateX(-${index * bannerWidth}px)`;
  }

  setInterval(moveCarousel, 10000);
</script>
</body>
</html>
