<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Foros Complementarios</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:40px 20px;
    font-family:Arial, sans-serif;
  }
  .carousel-container{
    width:100%;
    max-width:1200px;
    overflow:hidden;
    position:relative;
  }
  .carousel-track{
    display:flex;
    transition:transform 0.8s ease-in-out;
    gap:5cm;
  }
  .banner{
    min-width:calc(50% - 2.5cm);
    overflow:hidden;
    text-decoration:none;
    transition:transform .3s ease;
  }
  .banner:hover{transform:scale(1.02);}
  .banner img{width:100%;display:block;}
  @media(max-width:768px){
    .banner{min-width:100%;}
  }
</style>
</head>
<body>
<div class="carousel-container">
  <div class="carousel-track" id="carouselTrack">
    <a class="banner" href="https://empleabilidad.blackwell.university/registro/" target="_blank">
      <img src="https://i.postimg.cc/TPt8P5qS/disenos-pastillas-Mesa-de-trabajo-1-05.png" alt="Banner 05"/>
    </a>
    <a class="banner" href="https://www.iberoteca.net/" target="_blank">
      <img src="https://i.postimg.cc/3y0fSRq4/disenos-pastillas-Mesa-de-trabajo-1-06.png" alt="Banner 06"/>
    </a>
    <a class="banner" href="https://gan.education/globaltalks/conferencias/#b162614" target="_blank">
      <img src="https://i.postimg.cc/kVRY14HN/disenos-pastillas-Mesa-de-trabajo-1-07.png" alt="Banner 07"/>
    </a>
    <a class="banner" href="https://student.activa.education/es/auth/login" target="_blank">
      <img src="https://i.postimg.cc/KK3pqzWD/disenos-pastillas-Mesa-de-trabajo-1-08.png" alt="Banner 08"/>
    </a>
  </div>
</div>
<script>
  const track = document.getElementById("carouselTrack");
  const banners = document.querySelectorAll(".banner");
  let index = 0;
  function moveCarousel() {
    const bannerWidth = banners[0].offsetWidth + (5 * 37.8);
    const visibleItems = window.innerWidth <= 768 ? 1 : 2;
    index++;
    if(index > banners.length - visibleItems){
      index = 0;
    }
    track.style.transform = `translateX(-${index * bannerWidth}px)`;
  }
  setInterval(moveCarousel, 10000);
</script>
</body>
</html>
