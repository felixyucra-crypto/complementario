<title>Foros Complementarios</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #ffffff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
  }
  .foros-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    width: 100%;
    max-width: 1100px;
  }
  a.banner {
    display: block;
    text-decoration: none;
    border-radius: 10px;
    overflow: hidden;
    height: 110px;
    box-shadow: 0 4px 18px rgba(0,0,0,.18);
    transition: transform .2s, box-shadow .2s;
  }
  a.banner:hover {
    transform: translateY(-4px) scale(1.03);
    box-shadow: 0 12px 36px rgba(0,0,0,.28);
  }
  a.banner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  @media (max-width: 700px) { .foros-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 400px) { .foros-grid { grid-template-columns: 1fr; } }
</style>
